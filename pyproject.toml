[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nsdissert"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
  "numpy<2",
  "matplotlib<3.9",   # optional, but conservative/stable
  "scipy",            # if you use it anywhere
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
